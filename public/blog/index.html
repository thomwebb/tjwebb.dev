<script>
(function () {
  var themes = ['github-dark', 'gruvbox', 'dracula', 'solarized-dark', 'monokai', 'phosphor'];
  var colors = {
    'github-dark': '#0d1117',
    'gruvbox': '#282828',
    'dracula': '#282a36',
    'solarized-dark': '#002b36',
    'monokai': '#272822',
    'phosphor': '#050805'
  };
  var theme = 'github-dark';
  try {
    var saved = localStorage.getItem('tw-theme');
    if (saved && themes.indexOf(saved) !== -1) theme = saved;
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('meta-theme-color').content = colors[theme];
})();
</script>
<link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");

  }
  :root {
    /* github-dark (default) */

    --bg-soft: #161b22;

  }
  [data-theme="gruvbox"] {
    --bg: #282828;
    --bg-soft: #32302f;
    --border: #504945;
    --fg: #ebdbb2;
    --fg-dim: #a89984;
    --green: #b8bb26;
    --green-bright: #b8bb26;
    --cyan: #83a598;
    --yellow: #d79921;
    --heading: #fbf1c7;
  }
  [data-theme="dracula"] {
    --bg: #282a36;
    --bg-soft: #343746;
    --border: #44475a;
    --fg: #f8f8f2;
    --fg-dim: #98a5da;
    --green: #50fa7b;
    --green-bright: #50fa7b;
    --cyan: #8be9fd;
    --yellow: #f1fa8c;
    --heading: #bd93f9;
  }
  [data-theme="solarized-dark"] {
    --bg: #002b36;
    --bg-soft: #073642;
    --border: #11424f;
    --fg: #839496;
    --fg-dim: #8ba0a6;
    --green: #859900;
    --green-bright: #859900;
    --cyan: #2aa198;
    --yellow: #b58900;
    --heading: #93a1a1;
  }
  [data-theme="monokai"] {
    --bg: #272822;
    --bg-soft: #3e3d32;
    --border: #49483e;
    --fg: #f8f8f2;
    --fg-dim: #a6a28e;
    --green: #a6e22e;
    --green-bright: #a6e22e;
    --cyan: #66d9ef;
    --yellow: #e6db74;
    --heading: #ffffff;
  }
  [data-theme="phosphor"] {
    --bg: #050805;
    --bg-soft: #0c140c;
    --border: #1c331c;
    --fg: #33cc33;
    --fg-dim: #2a8a2a;
    --green: #33ff33;
    --green-bright: #66ff66;
    --cyan: #33ff99;
    --yellow: #ccff33;
    --heading: #66ff66;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }

  .theme-toggle {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 50;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--fg-dim);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
  }
  .theme-toggle:hover { color: var(--green-bright); border-color: var(--green); }
  .theme-toggle:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  header.hero { padding: 6rem 0 3.5rem; }
  .prompt {
    color: var(--fg-dim);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .prompt .dollar { color: var(--green); }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.1em;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1 {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 700;
    color: var(--green-bright);
    letter-spacing: -0.02em;
  }
  .role { color: var(--cyan); font-size: 1.1rem; margin-top: 0.5rem; }
  .tagline { margin-top: 1.5rem; color: var(--fg); max-width: 36em; }
  .tagline strong { color: var(--green-bright); font-weight: 600; }
  nav.links { margin-top: 2rem; display: flex; gap: 0.75rem 1.75rem; flex-wrap: wrap; }
  nav.links a {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg-dim);
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.15s ease;
  }
  nav.links a::before { content: "./"; color: var(--green); }
  nav.links a:hover, nav.links a:focus-visible { color: var(--green-bright); }

  section { padding: 3rem 0; border-top: 1px solid var(--border); }
  h2 {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    color: var(--green);
    margin-bottom: 2rem;
  }
  h2::before { content: "## "; color: var(--fg-dim); }

  footer {
    padding: 2.5rem 0 3.5rem;
    border-top: 1px solid var(--border);
    color: var(--fg-dim);
    font-size: 0.85rem;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover, footer a:focus-visible { text-decoration: underline; }

  /* global link default: keep links on-palette in every theme (no browser-default blue) */
  a { color: var(--green); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }

  /* === blog: reading layout; keep article template in sync. === */
  .post-list { list-style: none; }
  .post-list li { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
  .post-list h3 { font-size: 1.25rem; }
  .post-date { display: block; color: var(--fg-dim); font-size: 0.85rem; margin: 0.5rem 0; }
  .prose { padding: 2rem 0 3rem; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
  .prose p, .prose ul, .prose ol, .prose pre, .prose blockquote { margin: 0 0 1.5rem; }
  .prose h2, .prose h3 { margin: 2rem 0 1rem; color: var(--heading); font-size: 1.25rem; }
  .prose ul, .prose ol { padding-left: 1.5rem; }
  .prose pre { overflow-x: auto; padding: 1rem; background: var(--bg-soft); border: 1px solid var(--border); }
  .prose code { font-family: "JetBrains Mono", monospace; }
  .prose img { max-width: 100%; height: auto; }
  .prose blockquote { border-left: 3px solid var(--green); padding-left: 1rem; }
  a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
  .skip-link { position: absolute; left: 1rem; top: -5rem; padding: 0.5rem; background: var(--bg); z-index: 100; }
  .skip-link:focus { top: 1rem; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header class="hero">
    <p class="prompt mono"><span class="dollar">$</span> ls ~/blog</p>
    <h1>Blog</h1>
    <p class="tagline">Software engineering, agent harnesses, and developer tools.</p>
    <nav class="links" aria-label="Site navigation"><a href="/">home</a><a href="/blog/" aria-current="page">blog</a><a href="/blog/feed.xml">RSS</a></nav>
  </header>
  <main id="main" tabindex="-1">
    <section aria-labelledby="posts">
      <h2 id="posts">posts</h2>
      <p>No posts yet. New writing will appear here.</p>
    </section>
  </main>
  <footer><p>TJ Webb · <a href="/">home</a> · <a href="/blog/">blog</a> · <a href="/blog/feed.xml">RSS</a></p></footer>
</div>
<script>
(function () {
  var themes = ['github-dark', 'gruvbox', 'dracula', 'solarized-dark', 'monokai', 'phosphor'];
  var colors = {
    'github-dark': '#0d1117',
    'gruvbox': '#282828',
    'dracula': '#282a36',
    'solarized-dark': '#002b36',
    'monokai': '#272822',
    'phosphor': '#050805'
  };
  var btn = document.getElementById('theme-toggle');
  var meta = document.getElementById('meta-theme-color');
  var label = document.getElementById('theme-label');
  function current() {
    return document.documentElement.getAttribute('data-theme') || 'github-dark';
  }
  function sync() {
    var t = current();
    label.textContent = '[theme: ' + t + ']';
    btn.setAttribute('aria-label', 'Switch terminal theme (current: ' + t + ')');
    meta.content = colors[t];
  }
  btn.addEventListener('click', function () {
    var next = themes[(themes.indexOf(current()) + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('tw-theme', next); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
