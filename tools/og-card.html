<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0d1117;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9d1d9;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 90px;
    border: 2px solid #30363d;
    position: relative;
    overflow: hidden;
  }
  .prompt { color: #3fb950; font-size: 26px; margin-bottom: 28px; }
  .prompt .cursor { display: inline-block; width: 14px; height: 30px; background: #3fb950; vertical-align: -4px; margin-left: 6px; }
  h1 { color: #56d364; font-size: 96px; font-weight: 700; letter-spacing: -2px; margin-bottom: 18px; }
  .title { color: #39c5cf; font-size: 34px; margin-bottom: 40px; }
  .tagline { color: #c9d1d9; font-size: 26px; line-height: 1.5; max-width: 900px; }
  .tagline strong { color: #56d364; font-weight: 600; }
  .url { position: absolute; bottom: 48px; left: 90px; color: #8b949e; font-size: 24px; }
  .cat { position: absolute; bottom: 36px; right: 90px; color: #3fb950; font-size: 20px; line-height: 1.15; white-space: pre; }
</style>
</head>
<body>
  <div class="prompt">$ whoami<span class="cursor"></span></div>
  <h1>TJ Webb</h1>
  <div class="title">// Principal Software Engineer</div>
  <p class="tagline">I build agent harnesses and developer tools. Creator of <strong>gac</strong> (125k+ downloads), working on <strong>Code Puppy</strong>, an open-source AI coding agent.</p>
  <div class="url">tjwebb.dev</div>
  <div class="cat"> /\_/\
( o.o )
 &gt; ^ &lt;  ~</div>
</body>
</html>
